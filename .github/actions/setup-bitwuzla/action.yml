name: Bitwuzla setup
description: Cached build of Bitwuzla, the SMT solver the lec pass proves cut miters with, exported as $BITWUZLA

# SILIMATE: the release wheels ship Bitwuzla beside yosys-abc. A Yosys built from source has none,
# so lec falls back to ABC and the silimate tests that expect an SMT proof fail. This builds it
# the way the release does, with .github/workflows/wheels/build_bitwuzla.sh, and caches it on the
# files that build reads, so it is only rebuilt when they change.

runs:
  using: composite
  steps:
    # Not release-macos.yml's bitwuzla-macos- key: a build made here, with the test job's
    # environment, must never be the one a release restores and ships.
    - uses: actions/cache/restore@v6
      id: restore-bitwuzla
      with:
        path: ~/bitwuzla
        key: bitwuzla-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/wheels/build_bitwuzla.sh', '.github/workflows/wheels/manylinux.Dockerfile') }}

    # On Linux, the release's own build: manylinux.Dockerfile's bitwuzla stage, on the Ubuntu it
    # pins. The runner's Ubuntu may be newer than the script's GMP builds on (GCC 15's C23 default
    # fails GMP 6.3.0's configure), and the binary is static, so it runs on any runner.
    - name: Build Bitwuzla (Linux)
      if: steps.restore-bitwuzla.outputs.cache-hit != 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        docker build --target bitwuzla -t bitwuzla-build -f .github/workflows/wheels/manylinux.Dockerfile .github/workflows/wheels
        id=$(docker create bitwuzla-build)
        docker cp "$id:/opt/bitwuzla" ~/bitwuzla
        docker rm "$id"

    - name: Bitwuzla macOS deps
      if: steps.restore-bitwuzla.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        brew install meson ninja

    # With the runner's default compilers, as release-macos.yml builds it, not the job's CC
    - name: Build Bitwuzla (macOS)
      if: steps.restore-bitwuzla.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        env -u CC -u CXX .github/workflows/wheels/build_bitwuzla.sh ~/bitwuzla

    - uses: actions/cache/save@v6
      if: steps.restore-bitwuzla.outputs.cache-hit != 'true'
      with:
        path: ~/bitwuzla
        key: ${{ steps.restore-bitwuzla.outputs.cache-primary-key }}

    # lec takes $BITWUZLA over a bitwuzla beside yosys-abc
    - name: Export BITWUZLA
      shell: bash
      run: |
        "$HOME/bitwuzla/bin/bitwuzla" --version
        echo "BITWUZLA=$HOME/bitwuzla/bin/bitwuzla" >> "$GITHUB_ENV"
