name: Release (pyosys wheels)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }} # one at a time: versions are numbered from existing releases

jobs:
  set-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          python3 -m pip install githubkit "hishel<2"
          echo "version=$(python3 .github/workflows/wheels/silimate_get_version.py --github-token $GH_TOKEN silimate/yosys-wheels)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.YOSYS_WHEELS_TOKEN }}

  linux:
    name: Linux x86_64 wheel (manylinux2014, glibc 2.17+)
    needs: set-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # build image lives on ghcr.io
    env:
      PYOSYS_VERSION_OVERRIDE: ${{ needs.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # yosys version string counts commits since the last tag
          submodules: recursive
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Build wheel
        env:
          IMAGE: ghcr.io/silimate/yosys-manylinux:${{ hashFiles('.github/workflows/wheels/manylinux.Dockerfile') }}
        run: |
          # The build image is only rebuilt when its Dockerfile changes
          echo ${{ github.token }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull $IMAGE || (docker build -t $IMAGE - < .github/workflows/wheels/manylinux.Dockerfile && docker push $IMAGE)
          docker run --rm -v $PWD:$PWD -w $PWD -e PYOSYS_VERSION_OVERRIDE $IMAGE \
            sh -c '.github/workflows/wheels/build.sh && auditwheel repair --plat manylinux2014_x86_64 -w dist wheelhouse/*.whl && python3 .github/workflows/wheels/silimate_check_release.py dist'
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux
          path: dist/*.whl

  release:
    name: Create GitHub releases
    needs: [set-version, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # starts release-macos.yml
    steps:
      - uses: actions/checkout@v7
        with:
          repository: silimate/yosys-wheels
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.YOSYS_WHEELS_TOKEN }}
          VERSION: ${{ needs.set-version.outputs.version }}
        run: |
          SHA=${GITHUB_SHA::7} DATE=$(date -u +%F)
          cat > release_notes.md <<EOF
          Automated build from \`main\` @ [\`$SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)

          **Built:** $DATE

          ### Assets
          | File | Platform |
          |------|----------|
          | \`silimate_pyosys-*-manylinux2014*.whl\` | Linux x86-64 (manylinux2014, glibc 2.17+) |
          | \`silimate_pyosys-*-macosx_*_arm64.whl\` | macOS Apple Silicon (added when its build finishes) |

          ### Installation
          \`\`\`bash
          pip install silimate_pyosys-*.whl
          \`\`\`
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Build for $DATE-$SHA" && git push

          gh release create "v$VERSION" dist/*.whl --target $(git rev-parse HEAD) --title "Build $DATE ($SHA)" --notes-file release_notes.md
          git tag -f latest && git push -f origin latest
          gh release delete latest --yes || true
          gh release create latest dist/*.whl --target $(git rev-parse HEAD) --title "Latest Build ($DATE)" --notes-file release_notes.md --prerelease
      # macOS runners can queue for half an hour, so the macOS wheel is built in a workflow of its
      # own and added to this release when it is done; the next release need not wait for it
      - name: Start the macOS wheel
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.set-version.outputs.version }}
        run: gh workflow run release-macos.yml -R "$GITHUB_REPOSITORY" --ref main -f version="$VERSION" -f sha="$GITHUB_SHA"
