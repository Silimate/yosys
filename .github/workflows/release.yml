name: Release (pyosys wheels)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }} # one at a time: versions are numbered from existing releases

jobs:
  set-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          python3 -m pip install githubkit
          echo "version=$(python3 .github/workflows/wheels/silimate_get_version.py --github-token $GH_TOKEN silimate/yosys-wheels)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.YOSYS_WHEELS_TOKEN }}

  linux:
    name: Linux x86_64 wheel (manylinux2014, glibc 2.17+)
    needs: set-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # build image lives on ghcr.io
    env:
      PYOSYS_VERSION_OVERRIDE: ${{ needs.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # yosys version string counts commits since the last tag
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - run: git submodule update --init --recursive --depth 1 --jobs 8
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Build wheel
        env:
          IMAGE: ghcr.io/silimate/yosys-manylinux:${{ hashFiles('.github/workflows/wheels/manylinux.Dockerfile') }}
        run: |
          # The build image is only rebuilt when its Dockerfile changes
          echo ${{ github.token }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull $IMAGE || (docker build -t $IMAGE - < .github/workflows/wheels/manylinux.Dockerfile && docker push $IMAGE)
          docker run --rm -v $PWD:$PWD -w $PWD -e PYOSYS_VERSION_OVERRIDE $IMAGE \
            sh -c '.github/workflows/wheels/build.sh && auditwheel repair --plat manylinux2014_x86_64 -w dist wheelhouse/*.whl'
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux
          path: dist/*.whl

  macos:
    name: macOS arm64 wheel
    needs: set-version
    runs-on: macos-15
    env:
      PYOSYS_VERSION_OVERRIDE: ${{ needs.set-version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # yosys version string counts commits since the last tag
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - run: git submodule update --init --recursive --depth 1 --jobs 8
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          brew install bison flex gperf tcl-tk@8 libffi dwarfutils libelf ccache llvm
          printf '%s\n' $(brew --prefix bison)/bin $(brew --prefix flex)/bin $(brew --prefix llvm)/bin >> $GITHUB_PATH
          python3 -m pip install wheel packaging 'pybind11>=3,<4' 'cxxheaderparser>=1.4'
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-
      - run: .github/workflows/wheels/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macos
          path: wheelhouse/*.whl

  release:
    name: Create GitHub releases
    needs: [set-version, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: silimate/yosys-wheels
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.YOSYS_WHEELS_TOKEN }}
          VERSION: ${{ needs.set-version.outputs.version }}
        run: |
          SHA=${GITHUB_SHA::7} DATE=$(date -u +%F)
          cat > release_notes.md <<EOF
          Automated build from \`main\` @ [\`$SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)

          **Built:** $DATE

          ### Assets
          | File | Platform |
          |------|----------|
          | \`pyosys-*-manylinux2014*.whl\` | Linux x86-64 (manylinux2014, glibc 2.17+) |
          | \`pyosys-*-macosx_*_arm64.whl\` | macOS Apple Silicon |

          ### Installation
          \`\`\`bash
          pip install pyosys-*.whl
          \`\`\`
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Build for $DATE-$SHA" && git push

          gh release create "v$VERSION" dist/*.whl --target $(git rev-parse HEAD) --title "Build $DATE ($SHA)" --notes-file release_notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.whl --target $(git rev-parse HEAD) --title "Latest Build ($DATE)" --notes-file release_notes.md --prerelease
